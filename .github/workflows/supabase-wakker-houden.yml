name: Supabase wakker houden

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Klein verzoek naar Supabase
        run: |
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" js/portal-config.js)
          KEY=$(grep -oP "supabaseKey:\s*'\K[^']+" js/portal-config.js)
          if [[ "$URL" == *JOUW-* ]]; then
            echo "Portaal nog niet ingesteld; niets te doen."
            exit 0
          fi
          curl -fsS "$URL/rest/v1/documenten?select=id&limit=1" -H "apikey: $KEY"
          echo
          echo "Supabase is actief."
